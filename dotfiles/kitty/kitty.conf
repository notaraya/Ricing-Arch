# kitty.conf generated by Confitty, https://confitty.app
# Target: Kitty 0.48.0
# Place this file at: ~/.config/kitty/kitty.conf
# Reload without restart: Ctrl+Shift+F5  |  Docs: https://sw.kovidgoyal.net/kitty/conf/
# Only settings that differ from Kitty defaults are included.

# --- Fonts ---
font_family Menlo
font_size 10
disable_ligatures cursor
modify_font cell_height 120%

# --- Cursor ---
cursor #ffffff
cursor_text_color #282a36
cursor_blink_interval 0

# --- Scrollback ---
scrollback_lines 10000
touch_scroll_multiplier 1.5

# --- Mouse ---
url_color #8be9fd
underline_hyperlinks always
copy_on_select clipboard
strip_trailing_spaces smart

# --- Bell ---
enable_audio_bell no

# --- Window Layout ---
window_border_width 1pt
window_padding_width 4
active_border_color #bd93f9
inactive_text_alpha 0.7
hide_window_decorations yes
confirm_os_window_close 1
background_opacity 0.85
background_blur 6

# --- Tab Bar ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_foreground #282a36
active_tab_background #bd93f9
inactive_tab_foreground #f8f8f2
inactive_tab_background #44475a

# --- Colors ---
foreground #f8f8f2
background #282a36
selection_foreground #282a36
selection_background #44475a
color0 #21222c
color1 #ff5555
color2 #50fa7b
color3 #f1fa8c
color4 #bd93f9
color5 #ff79c6
color6 #8be9fd
color7 #f8f8f2
color8 #6272a4
color9 #ff6e6e
color10 #69ff94
color11 #ffffa5
color12 #d6acff
color13 #ff92df
color14 #a4ffff

# --- Advanced ---
allow_remote_control socket-only
confirm_os_window_close 0

# --- Wallpaper theme (generated by ~/.config/hypr/random-wallpaper.sh) ---
# Must stay last so its colors override everything above.
include wallpaper-theme.conf
